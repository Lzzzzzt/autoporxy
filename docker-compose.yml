name: proxy-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  snell:
    build:
      context: ./snell
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/snell/snell-server.conf:/etc/snell-server.conf:ro,Z
    logging: *default-logging
    networks:
      - proxy_internal

  shadow-tls:
    image: ${SHADOWTLS_IMAGE}
    restart: unless-stopped
    depends_on:
      - snell
    environment:
      MODE: server
      LISTEN: 0.0.0.0:32413
      SERVER: snell:23413
      TLS: ${SHADOWTLS_SNI}:${SHADOWTLS_TARGET_HOST:-${SHADOWTLS_SNI}}:${SHADOWTLS_TARGET_PORT};${SHADOWTLS_TARGET_HOST:-${SHADOWTLS_SNI}}:${SHADOWTLS_TARGET_PORT}
      PASSWORD: ${SHADOWTLS_PASSWORD}
      V3: "1"
      STRICT: ${SHADOWTLS_STRICT_ENV:-}
      FASTOPEN: ${SHADOWTLS_FAST_OPEN_ENV:-}
      RUST_LOG: ${SHADOWTLS_LOG_LEVEL:-warn}
    ports:
      - ${SNELL_PORT}:32413/tcp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: 8388608
        hard: 8388608
    logging: *default-logging
    networks:
      - proxy_internal

  hysteria:
    image: ${HYSTERIA_IMAGE}
    restart: unless-stopped
    command:
      - server
      - -c
      - /etc/hysteria/config.yaml
    volumes:
      - ./data/hysteria/config.yaml:/etc/hysteria/config.yaml:ro,Z
      - ./data/hysteria/acme:/var/lib/hysteria/acme:z
      - ./data/reality/www:/www/masq:ro,Z
    ports:
      - ${HY2_PORT}:32123/udp
      - 80:80/tcp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - proxy_internal

  reality-web:
    profiles:
      - self
    image: ${NGINX_IMAGE:-nginx:latest}
    restart: unless-stopped
    depends_on:
      hysteria:
        condition: service_started
    entrypoint:
      - /bin/sh
      - /opt/reality-web/reload-cert.sh
    environment:
      SELF_WEB_DOMAINS: ${SELF_WEB_DOMAINS:-${REALITY_SNI:-}}
      SELF_WEB_CERT_BASE: /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory
      SELF_WEB_CERT_RELOAD_INTERVAL: "3600"
    volumes:
      - ./reality-web/reload-cert.sh:/opt/reality-web/reload-cert.sh:ro,Z
      - ./data/reality/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./data/reality/www:/usr/share/nginx/html:ro,Z
      - ./data/hysteria/acme:/var/lib/hysteria/acme:ro,z
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    logging: *default-logging
    networks:
      - proxy_internal

  xray:
    image: ${XRAY_IMAGE}
    restart: unless-stopped
    command:
      - run
      - -config
      - /etc/xray/config.json
    volumes:
      - ./data/xray/config.json:/etc/xray/config.json:ro,Z
    ports:
      - ${XRAY_PORT}:443/tcp
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - proxy_internal

networks:
  proxy_internal:
    driver: bridge
